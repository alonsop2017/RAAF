# Temporary: HTTP access via IP while DNS is down
server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Docker embedded DNS — re-resolve upstream at request time so a rebuilt
    # raaf-app container (new IP) is picked up without an nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set                $upstream_app raaf-app;
        proxy_pass         http://$upstream_app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

server {
    listen 80;
    server_name raaf.peoplefindinc.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name raaf.peoplefindinc.com;

    ssl_certificate     /etc/letsencrypt/live/raaf.peoplefindinc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raaf.peoplefindinc.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Docker embedded DNS — re-resolve upstream at request time so a rebuilt
    # raaf-app container (new IP) is picked up without an nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set                $upstream_app raaf-app;
        proxy_pass         http://$upstream_app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
